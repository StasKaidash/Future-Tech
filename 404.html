<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Future Tech | Page not found</title>
  <link rel="stylesheet" href="./styles/main.css">
  <meta name="description" content="404 — page not found">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
  <style>
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      color: var(--color-light);
      background-color: var(--color-dark);
      font-family: var(--font-family-base);
    }
    .not-found__code {
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--color-accent);
      margin: 0;
    }
    .not-found__title {
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 600;
      margin: 1rem 0 0.5rem;
    }
    .not-found__text {
      max-width: 32rem;
      color: var(--color-gray-60);
      margin: 0 0 2rem;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <p class="not-found__code">404</p>
    <h1 class="not-found__title">Page not found</h1>
    <p class="not-found__text">The page you are looking for doesn't exist or has been moved.</p>
    <a href="./index.html" class="button button--accent">Back to home</a>
  </main>
</body>
</html>
